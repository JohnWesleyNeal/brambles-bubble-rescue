<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#183b3a" />
    <meta name="description" content="Bramble's Bubble Rescue: a cosy bubble popping game." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Bramble's Bubble Rescue</title>
  </head>
  <body>
    <main id="app" aria-label="Bramble's Bubble Rescue game">
      <div id="game-shell">
        <img class="scene-backdrop" src="%BASE_URL%scene.svg" alt="" />
        <div id="game"></div>
        <div id="hud" class="hidden" aria-live="polite">
          <div class="hud-top">
            <button id="home-button" class="icon-button" aria-label="Pause game" title="Pause game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
            <div class="level-label"><small>LEVEL <span id="level-number">01</span></small><strong id="level-name">Hedgerow Hello</strong></div>
            <button id="mute-button" class="icon-button" aria-label="Mute sound" title="Toggle sound">♫</button>
          </div>
          <div class="hud-stats">
            <div class="stat"><span class="stat-icon" id="hive-target" aria-label="Bee hive"><svg viewBox="0 0 32 32" width="25" height="25" aria-hidden="true"><path d="M4 27Q4 5 16 3q12 2 12 24Z" fill="#deb567" stroke="#a67a40" stroke-width="2"/><path d="M8 12h16M6 18h20M4 24h24" stroke="#b48a46" stroke-width="2"/><path d="M12 28v-5a4 4 0 0 1 8 0v5" fill="#775737"/></svg></span><span><strong id="bees-count">0/0</strong><small>friends freed</small></span></div>
            <div class="stat"><span class="stat-icon shot-stat-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="#df9b78"/><circle cx="16" cy="16" r="7" fill="none" stroke="#fff5df" stroke-width="1.5"/><path d="M10 13q1-4 5-4" stroke="#fff9ea" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span><span><strong id="shots-count">0</strong><small>bubbles left</small></span></div>
          </div>
          <small id="star-target"></small>
          <div id="mechanic-status" class="mechanic-status hidden"></div>
          <button id="bloom-shot" hidden aria-label="Equip earned Bloom shot" aria-pressed="false"></button>
          <div class="game-bottom">
            <p id="coach-line">Drag to aim · release to pop</p>
            <div class="game-actions">
              <button id="help-button" class="dock-button" aria-label="Show level hint"><span aria-hidden="true">?</span> Hint</button>
              <button id="bag-button" class="dock-button gifts-button" aria-label="Open gifts"><span aria-hidden="true">✦</span> Gifts <small id="gift-count">0</small></button>
              <button id="swap-button" class="dock-button" aria-label="Swap current and next bubble"><span aria-hidden="true">↔</span> Swap</button>
            </div>
          </div>
        </div>
        <div id="inspect-bar" class="inspect-bar hidden"><span>INSPECT · Tap any bubble</span><button id="inspect-done" aria-label="Stop inspecting">Done</button></div>
        <div id="toast" class="toast hidden" role="status"></div>
        <div id="overlay" class="overlay"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
